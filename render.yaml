# Only one FREE Render web service; no paid worker, Key Value, disk, or trial.
# Gemini/Cloudflare/Supabase/Upstash accounts must also remain on their free plans.
services:
  - type: web
    name: amr-web
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node --max-old-space-size=48 scripts/start-combined.mjs
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: SERVE_WEB
        value: 'true'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: amr-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_BASE_URL
        fromService:
          type: web
          name: amr-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: amr_guest
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_MODE
        value: gemini
      - key: FREE_TIER_ONLY
        value: 'true'
      - key: MEDIA_PROVIDER
        value: cloudflare
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TEXT_MIN_INTERVAL_MS
        value: '15000'
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: '@cf/black-forest-labs/flux-1-schnell'
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        value: ai-mystery-private
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: 'true'
      - key: MAX_ACTIVE_GENERATIONS_PER_SESSION
        value: '1'
      - key: MAX_NEW_CASES_PER_SESSION_PER_24H
        value: '1'
      - key: GENERATION_WATCHDOG_MINUTES
        value: '20'
      - key: CASE_RETENTION_DAYS
        value: '30'
      - key: WORKER_CONCURRENCY
        value: '1'
      - key: WORKER_DRAIN_DELAY_SECONDS
        value: '60'
      - key: WORKER_STALLED_INTERVAL_MS
        value: '120000'
      - key: MAX_MEDIA_BYTES
        value: '20971520'
